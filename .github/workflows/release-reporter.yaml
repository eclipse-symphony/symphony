name: Publish built reporter custom release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: reporter-custom-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_VERSION: 0.48.48-reporter
  SOURCE_SHA: 5fa05eb33b2e6e350b1955db0390a6ee19f70f73
  BUILD_RUN_ID: "39860478248"
  REGISTRY: ghcr.io/eclipse-symphony
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    if: github.repository == 'eclipse-symphony/symphony'
    runs-on: ubuntu-22.04
    steps:
      - name: Verify successful source build
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" \
            | jq -e '.conclusion == "success" and .path == ".github/workflows/release-reporter.yaml"'
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: "@(reporter-packages|reporter-charts|symphony-api|symphony-target-agent|symphony-poll-agent|symphony-k8s)"
          path: ${{ runner.temp }}/reporter-artifacts
      - name: Install registry publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          curl -fsSL https://raw.githubusercontent.com/helm/helm/v3.16.2/scripts/get-helm-3 -o "$RUNNER_TEMP/get-helm.sh"
          bash "$RUNNER_TEMP/get-helm.sh" --version v3.16.2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify artifact versions and refuse existing custom tags
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fx "$RELEASE_VERSION" "$RUNNER_TEMP/release-tags"; then
            echo "::error::Custom release already exists"
            exit 1
          fi
          for image in symphony-api symphony-target-agent symphony-poll-agent symphony-k8s helm/symphony helm/symphony-poll-agent; do
            skopeo list-tags --authfile "$HOME/.docker/config.json" "docker://$REGISTRY/$image" \
              | jq -e --arg tag "$RELEASE_VERSION" '.Tags | index($tag) == null'
          done
          for image in symphony-api symphony-target-agent symphony-poll-agent symphony-k8s; do
            skopeo inspect --raw "oci-archive:$RUNNER_TEMP/reporter-artifacts/$image/$image.tar" \
              | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64","arm","arm64"]'
            skopeo inspect --config --override-os linux --override-arch amd64 \
              "oci-archive:$RUNNER_TEMP/reporter-artifacts/$image/$image.tar" \
              | jq -e --arg sha "$SOURCE_SHA" --arg version "$RELEASE_VERSION" \
                '.config.Labels["org.opencontainers.image.revision"] == $sha and .config.Labels["org.opencontainers.image.version"] == $version'
          done
          for chart in symphony symphony-poll-agent; do
            helm show chart "$RUNNER_TEMP/reporter-artifacts/reporter-charts/$chart-$RELEASE_VERSION.tgz" \
              | grep -Fx "version: $RELEASE_VERSION"
          done
      - name: Publish existing multi-platform images without rebuilding
        run: |
          for image in symphony-api symphony-target-agent symphony-poll-agent symphony-k8s; do
            skopeo copy --all --authfile "$HOME/.docker/config.json" \
              "oci-archive:$RUNNER_TEMP/reporter-artifacts/$image/$image.tar" \
              "docker://$REGISTRY/$image:$RELEASE_VERSION"
            skopeo inspect --raw "oci-archive:$RUNNER_TEMP/reporter-artifacts/$image/$image.tar" > "$RUNNER_TEMP/source-manifest"
            skopeo inspect --raw --authfile "$HOME/.docker/config.json" \
              "docker://$REGISTRY/$image:$RELEASE_VERSION" > "$RUNNER_TEMP/published-manifest"
            cmp "$RUNNER_TEMP/source-manifest" "$RUNNER_TEMP/published-manifest"
          done
      - name: Publish existing custom-version charts
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for chart in symphony symphony-poll-agent; do
            helm push "$RUNNER_TEMP/reporter-artifacts/reporter-charts/$chart-$RELEASE_VERSION.tgz" "oci://$REGISTRY/helm"
            helm show chart "oci://$REGISTRY/helm/$chart" --version "$RELEASE_VERSION"
          done
      - name: Verify published images are anonymously accessible
        run: |
          printf '{"auths":{}}\n' > "$RUNNER_TEMP/anonymous-auth.json"
          for image in symphony-api symphony-target-agent symphony-poll-agent symphony-k8s; do
            skopeo inspect --raw --authfile "$RUNNER_TEMP/anonymous-auth.json" "docker://$REGISTRY/$image:$RELEASE_VERSION" \
              | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64","arm","arm64"]'
          done
      - name: Publish customer-downloadable custom prerelease
        run: |
          cd "$RUNNER_TEMP/reporter-artifacts"
          sha256sum reporter-packages/maestro_* reporter-charts/*.tgz > SHA256SUMS
          notes="Custom release based on Symphony 0.48.48 with MQTT agent status reporting (#865), expression cycle detection (#851), and Ubuntu 22.04 runtime pin (#866).

          Source: $SOURCE_SHA
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID

          Download the Maestro package for your platform below. Linux packages include the API/agent executable; Windows and macOS packages include the CLI only.

          Container images (AMD64, ARM64, ARMv7):
          - $REGISTRY/symphony-api:$RELEASE_VERSION
          - $REGISTRY/symphony-target-agent:$RELEASE_VERSION
          - $REGISTRY/symphony-poll-agent:$RELEASE_VERSION
          - $REGISTRY/symphony-k8s:$RELEASE_VERSION

          Install the control plane:
          helm upgrade --install symphony oci://$REGISTRY/helm/symphony --version $RELEASE_VERSION --namespace default

          MQTT reporting requires configuring the status vendor and matching receiver. Normal latest tags and existing releases are unchanged."
          gh release create "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Symphony $RELEASE_VERSION" --prerelease --latest=false \
            --notes "$notes" reporter-packages/maestro_* reporter-charts/*.tgz SHA256SUMS
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json url,isDraft,assets --jq '{url,isDraft,assets:[.assets[].name]}'
