apiVersion: v2
name: symphony
description: A Helm chart for Symphony control plane
type: application
# This branch uses an explicit custom-release version instead of auto-incrementing.
version: "0.48.48-reporter"
appVersion: "0.48.48-reporter"
dependencies:
  - name: cert-manager
    version: "1.13.1"
    repository: "https://charts.jetstack.io"
    condition: cert-manager.enabled
  - name: zipkin
    version: "0.7.0"
    repository: "https://openzipkin.github.io/zipkin"
    condition: observability.tracing.exporter.zipkin
